<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windson Wood Personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- CDN das imagens/GIFs do catálogo de exercícios (© Gym visual) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Fonte de ícones servida do PRÓPRIO site (public/fonts), não do Google: em celular com rede
      ruim ou bloqueador, o Google Fonts não chegava e a tela mostrava "fitness_center",
      "chevron_left" etc. por extenso. É um recorte só com os ícones usados no app (~33 KB);
      ao usar um ícone novo, regenerar com o parâmetro icon_names (ver globals.css).
    -->
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
